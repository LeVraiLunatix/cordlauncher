[package]
name = "cordlauncher"
version = "0.1.0"
description = "Hub d'installation Windows de la suite Cord"
authors = ["LeVraiLunatix"]
edition = "2021"

[lib]
# Le suffixe `_lib` évite la collision de noms lib/bin sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "cordlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
