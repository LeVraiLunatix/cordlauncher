<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Architecture : CordLauncher (Tauri, React, Rust) sur le PC, le service Compte Cord, l'iPhone, Apple et GitHub Releases">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e58f0"/><stop offset="1" stop-color="#b842ec"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#126A84"/><stop offset="1" stop-color="#1CC3E0"/></linearGradient>
    <radialGradient id="bgA"><stop offset="0" stop-color="#6e58f0" stop-opacity="0.5"/><stop offset="1" stop-color="#6e58f0" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgB"><stop offset="0" stop-color="#b842ec" stop-opacity="0.4"/><stop offset="1" stop-color="#b842ec" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="660" rx="26"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9b8ff"/></marker>
    <style>
      text { font-family: "Segoe UI Variable Text", "Segoe UI", Inter, Arial, sans-serif; fill: #f6f4fb; }
      .t { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, Arial, sans-serif; font-weight: 700; }
      .m { fill-opacity: 0.62; } .s { fill-opacity: 0.42; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .flow { stroke: #c9b8ff; stroke-width: 2; fill: none; stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      .flow.slow { animation-duration: 2.6s; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="660" fill="#07060c"/>
    <ellipse cx="220" cy="300" rx="380" ry="320" fill="url(#bgA)"/>
    <ellipse cx="760" cy="120" rx="360" ry="240" fill="url(#bgB)"/>

    <!-- Ton PC -->
    <text x="40" y="52" font-size="12" font-weight="700" letter-spacing="2" class="s">TON PC · WINDOWS 10 / 11</text>
    <rect x="30" y="66" width="470" height="554" rx="26" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.1" stroke-dasharray="4 6"/>

    <!-- Installateur -->
    <rect x="54" y="90" width="422" height="78" rx="18" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.1"/>
    <rect x="72" y="108" width="42" height="42" rx="12" fill="url(#brand)"/>
    <path d="M93 118v17M86 128l7 7 7-7M84 142h18" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="125" font-size="16" class="t">Installateur maison</text>
    <text x="128" y="147" font-size="12.5" class="m">Tauri · embarque le NSIS · <tspan class="mono">installer/</tspan></text>
    <path class="flow slow" d="M265 168v26" marker-end="url(#arrow)"/>

    <!-- CordLauncher -->
    <rect x="54" y="200" width="422" height="396" rx="22" fill="#fff" fill-opacity="0.07" stroke="url(#brand)" stroke-width="1.5"/>
    <rect x="72" y="220" width="46" height="46" rx="13" fill="url(#brand)"/>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="84" y1="232" x2="95" y2="243"/><line x1="106" y1="232" x2="95" y2="243"/><line x1="84" y1="254" x2="95" y2="243"/><line x1="106" y1="254" x2="95" y2="243"/></g>
    <g fill="#fff"><circle cx="84" cy="232" r="5"/><circle cx="106" cy="232" r="5"/><circle cx="84" cy="254" r="5"/><circle cx="106" cy="254" r="5"/></g>
    <text x="132" y="240" font-size="20" class="t">CordLauncher</text>
    <text x="132" y="260" font-size="12.5" class="m">Tauri 2 · une seule fenêtre, sans droits admin</text>

    <rect x="72" y="282" width="386" height="92" rx="16" fill="#fff" fill-opacity="0.05"/>
    <text x="88" y="306" font-size="12" font-weight="700" letter-spacing="1.4" class="s">INTERFACE · src/</text>
    <text x="88" y="330" font-size="14.5" font-weight="600">React 19 · TypeScript · Tailwind 4 · Motion</text>
    <text x="88" y="354" font-size="12.5" class="m">Découvrir · Bibliothèque · iPhone · Compte · Réglages · accueil</text>

    <rect x="72" y="386" width="386" height="190" rx="16" fill="#fff" fill-opacity="0.05"/>
    <text x="88" y="410" font-size="12" font-weight="700" letter-spacing="1.4" class="s">CŒUR · src-tauri/ (Rust)</text>
    <g font-size="12.5">
      <rect x="88" y="424" width="170" height="30" rx="15" fill="#6e58f0" fill-opacity="0.22"/><text x="102" y="444">Installation Windows</text>
      <rect x="266" y="424" width="176" height="30" rx="15" fill="#6e58f0" fill-opacity="0.22"/><text x="280" y="444">iPhone · isideload</text>
      <rect x="88" y="462" width="170" height="30" rx="15" fill="#6e58f0" fill-opacity="0.22"/><text x="102" y="482">Wi-Fi direct · Bonjour</text>
      <rect x="266" y="462" width="176" height="30" rx="15" fill="#6e58f0" fill-opacity="0.22"/><text x="280" y="482">Coffre Windows</text>
      <rect x="88" y="500" width="170" height="30" rx="15" fill="#6e58f0" fill-opacity="0.22"/><text x="102" y="520">Relais Compte Cord</text>
      <rect x="266" y="500" width="176" height="30" rx="15" fill="#6e58f0" fill-opacity="0.22"/><text x="280" y="520">Notifications</text>
    </g>
    <text x="88" y="558" font-size="12" class="s">registre · SHA-256 · NSIS /S · lockdown · mDNS · keyring</text>

    <!-- Compte Cord -->
    <text x="600" y="52" font-size="12" font-weight="700" letter-spacing="2" class="s">EN LIGNE</text>
    <rect x="590" y="66" width="340" height="280" rx="22" fill="#fff" fill-opacity="0.07" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="612" y="102" font-size="19" class="t">Compte Cord</text>
    <text x="612" y="124" font-size="12.5" class="m mono">compte.cordsuite.app · account-service/</text>
    <text x="612" y="148" font-size="12.5" class="m">Node 22 · Vercel · Neon Postgres · portail sans CDN</text>
    <g font-size="12.5">
      <rect x="612" y="166" width="140" height="30" rx="15" fill="#b842ec" fill-opacity="0.2"/><text x="626" y="186">OIDC + PKCE</text>
      <rect x="760" y="166" width="150" height="30" rx="15" fill="#b842ec" fill-opacity="0.2"/><text x="774" y="186">Passkeys · 2FA</text>
      <rect x="612" y="204" width="140" height="30" rx="15" fill="#b842ec" fill-opacity="0.2"/><text x="626" y="224">Passcord Ed25519</text>
      <rect x="760" y="204" width="150" height="30" rx="15" fill="#b842ec" fill-opacity="0.2"/><text x="774" y="224">Web Push</text>
      <rect x="612" y="242" width="140" height="30" rx="15" fill="#b842ec" fill-opacity="0.2"/><text x="626" y="262">Catalogue</text>
      <rect x="760" y="242" width="150" height="30" rx="15" fill="#b842ec" fill-opacity="0.2"/><text x="774" y="262">Bêtas fermées</text>
    </g>
    <text x="612" y="302" font-size="12" class="s">Drivecord, Passcord et les autres apps</text>
    <text x="612" y="320" font-size="12" class="s">s'y connectent avec « Continuer avec Cord »</text>

    <!-- GitHub Releases -->
    <rect x="960" y="66" width="210" height="120" rx="20" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/>
    <text x="980" y="100" font-size="16" class="t">GitHub Releases</text>
    <text x="980" y="124" font-size="12.5" class="m">installateurs publics</text>
    <text x="980" y="144" font-size="12.5" class="m">builds bêta privés</text>
    <text x="980" y="170" font-size="11.5" class="s mono">cordlauncher-releases</text>

    <!-- Apple -->
    <rect x="960" y="226" width="210" height="120" rx="20" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/>
    <text x="980" y="260" font-size="16" class="t">Apple</text>
    <text x="980" y="284" font-size="12.5" class="m">connexion GSA + 2FA</text>
    <text x="980" y="304" font-size="12.5" class="m">certificat &amp; profil</text>
    <text x="980" y="330" font-size="11.5" class="s">compte gratuit : 7 jours</text>

    <!-- iPhone -->
    <text x="600" y="416" font-size="12" font-weight="700" letter-spacing="2" class="s">TON IPHONE</text>
    <rect x="590" y="430" width="580" height="190" rx="22" fill="#fff" fill-opacity="0.06" stroke="url(#teal)" stroke-width="1.5"/>
    <rect x="612" y="456" width="78" height="140" rx="18" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="632" y="462" width="38" height="8" rx="4" fill="#fff" fill-opacity="0.4"/>
    <rect x="626" y="482" width="22" height="22" rx="6" fill="url(#brand)"/><rect x="654" y="482" width="22" height="22" rx="6" fill="url(#teal)"/>
    <rect x="626" y="510" width="22" height="22" rx="6" fill="#F65D63"/><rect x="654" y="510" width="22" height="22" rx="6" fill="#37CC94"/>
    <text x="712" y="478" font-size="17" class="t">Apps signées par CordLauncher</text>
    <text x="712" y="500" font-size="12.5" class="m">Drivecord, Passcord… renouvelées avant d'expirer</text>
    <text x="712" y="534" font-size="17" class="t">Passcord, la clé du compte</text>
    <text x="712" y="556" font-size="12.5" class="m">demande de connexion → bon nombre → Face ID</text>
    <text x="712" y="592" font-size="12" class="s">Web app Compte Cord : notifications sur l'écran d'accueil</text>

    <!-- Flux -->
    <path class="flow" d="M476 300 C530 300 540 200 588 200" marker-end="url(#arrow)"/>
    <text x="490" y="226" font-size="11.5" class="m">compte, catalogue</text>
    <path class="flow slow" d="M930 126 H956" marker-start="url(#arrow)"/>
    <path class="flow" d="M476 430 C540 430 540 382 600 382 H1065 V350" marker-end="url(#arrow)"/>
    <text x="880" y="374" font-size="11.5" class="m">signature (compte Apple)</text>
    <path class="flow" d="M476 490 C540 490 540 525 588 525" marker-end="url(#arrow)"/>
    <text x="494" y="548" font-size="11.5" class="m">USB / Wi-Fi</text>
    <path class="flow slow" d="M760 346 V428" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="770" y="410" font-size="11.5" class="m">demandes Passcord · push</text>
    <path class="flow slow" d="M1065 186 V222" />
    <circle class="pulse" cx="265" cy="182" r="4" fill="#c9b8ff"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="26" fill="none" stroke="#fff" stroke-opacity="0.1"/>
</svg>
